# Production override for a single public Linux VM (e.g. Oracle Cloud's
# Always Free ARM instance). Layered on the local compose file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# What it changes, and why:
#   * api uses the same image as the base file (Dockerfile.hf: CPU-only torch,
#     non-root user, model weights baked in), with durable checkpoints
#     required, a memory ceiling and a shutdown grace period.
#   * Nothing but Caddy publishes a port. Postgres and Qdrant are reachable only
#     on the compose network. Docker's published ports bypass the host's
#     iptables INPUT chain, so "the firewall blocks it" is not a defence.
#   * Caddy terminates TLS for $DOMAIN with an automatically issued
#     certificate. The Vercel frontend is served over HTTPS, and browsers block
#     an HTTPS page from calling a plain-HTTP API.
#   * Streamlit is local-only and does not start here.
#   * Secrets are required, not defaulted: an unset POSTGRES_PASSWORD or
#     ADMIN_API_KEY fails `up` instead of starting with "password" or no admin.
#
# Needs Docker Compose 2.24+ for `!reset`.

x-logging: &logging
  # The json-file driver keeps every line forever by default; on a small boot
  # volume that is a slow-motion outage.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    restart: unless-stopped
    logging: *logging

  qdrant:
    ports: !reset []
    restart: unless-stopped
    logging: *logging

  api:
    build:
      context: .
      dockerfile: Dockerfile.hf
    ports: !reset []
    # Replaces the base file's ./data bind mount: only the audit trail persists.
    volumes: !override
      - audit_logs:/home/user/audit
    env_file: .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - AUDIT_LOG_DIR=/home/user/audit
      - POSTGRES_URL=postgresql://manda_user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/manda_rag
      - ENVIRONMENT=production
      - ADMIN_API_KEY=${ADMIN_API_KEY:?set ADMIN_API_KEY in .env}
      # Caddy replaces any client-supplied X-Forwarded-For with the address it
      # actually saw, so the first hop is the visitor and is safe to trust.
      - TRUST_PROXY_HEADERS=1
      - CORS_ORIGINS=${CORS_ORIGINS:?set CORS_ORIGINS to the Vercel URL}
      - WARM_MODELS=1
      # The Laya answerability gate. On a CPU it scores one (question, passage)
      # pair at a time and stops at the first that clears the veto: measured at
      # 2 threads (x86, not this ARM host) p50 0.9 s / p95 1.9 s per assessment
      # on the golden set, down from 4.3 s / 6.5 s batched on the dev set. Cheap
      # enough now, but still off by default: with MiniLM's ranking it vetoes
      # one answerable golden question (mh_06) that bge admits. Set LAYA_GATE=1
      # in .env to trade that for two controls refused without an LLM call.
      # The query guard (~1.3 s) stays on.
      - LAYA_GATE=${LAYA_GATE:-0}
      # Postgres runs next to the API here, so failing to reach it is a fault,
      # not a reason to fall back to in-memory checkpoints and carry on.
      - REQUIRE_DURABLE_CHECKPOINTS=1
      # The deal the public demo serves; everything else needs the admin key.
      - PUBLIC_DEAL_IDS=${PUBLIC_DEAL_IDS:-aurora_vertex_2024}
      # SIGTERM → in-flight queries get this long before they are cancelled.
      # Kept under stop_grace_period so Docker never has to SIGKILL.
      - SHUTDOWN_GRACE_SECONDS=25
    stop_grace_period: 40s
    # 2 OCPU / 12GB, shared with Qdrant and Postgres: the models need ~6GB.
    # A ceiling keeps a runaway parse from taking the database down with it.
    mem_limit: 9g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7860/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Loading bge-m3, the reranker and the NLI model on 2 ARM cores takes
      # minutes; without a start period Caddy would wait on an "unhealthy" api.
      start_period: 600s
    logging: *logging

  streamlit:
    profiles: ["local-ui"]

  caddy:
    image: caddy:2-alpine
    container_name: manda-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. redline-dd.duckdns.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificates — losing this re-issues and can hit rate limits
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  audit_logs:
