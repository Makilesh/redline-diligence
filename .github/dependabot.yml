# Dependabot version updates (active since 2026-11-25). Alerts and security updates are
# switched on separately, in Settings → Code security and analysis, and need no file.
#
# pip is left out on purpose. The versions CI and the images install live in
# constraints.txt, generated from the measured environment by scripts/update_constraints.py,
# which Dependabot does not run: its pip pull requests would edit the ranges in
# requirements*.txt and leave constraints.txt unchanged, so CI would pass on versions nobody
# installs. Python advisories are covered by the Dependency audit workflow, which audits
# constraints.txt itself (Decision 104). A pip *security* pull request can still arrive
# (security updates read requirements*.txt): take its version into constraints.txt with
# scripts/update_constraints.py instead of merging it as it is.
#
# cooldown holds a release back until it is two weeks old: most malicious publishes are
# caught and pulled within days, and these packages run with access to the build machine.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    # Majors that need a migration of their own, not a version bump (2026-11-25):
    # ESLint 10 is outside eslint-config-next 15's peer range (npm ci fails), and
    # TypeScript 7 rejects the side-effect CSS import in app/layout.tsx (TS2882) —
    # both move with the Next.js upgrade. @types/node follows the Node runtime
    # (CI and the development machine: 24), not the newest Node.
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
